# Exemple de workflow GitHub Actions : revue automatique des Pull Requests par Claude.
# A copier dans .github/workflows/ ; nécessite le secret ANTHROPIC_API_KEY.
# Vérifier la version courante de l'action : https://github.com/anthropics/claude-code-action
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Relis cette Pull Request en appliquant les conventions de CLAUDE.md
            et la grille de l'agent .claude/agents/spring-reviewer.md.
            Lance ./mvnw -B verify et signale tout test en échec.
            Publie un commentaire de synthèse et des commentaires en ligne pour les problèmes bloquants.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(./mvnw:*),Bash(git diff:*),Bash(gh pr comment:*)"
